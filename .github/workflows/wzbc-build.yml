name: WZBC Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main, dev, WZBC-Launcher]
  push:
    branches: [main, dev, WZBC-Launcher]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'Dr-jesper/WZBC-Launcher'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build WZBC launcher
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: ./scripts/conduit/Publish.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: WZBC-Launcher-win-x64
          path: |
            artifacts/wzbc/*.zip
            artifacts/wzbc/*.sha256
          if-no-files-found: error
      - name: Offline regression tests
        shell: pwsh
        run: dotnet test PCL.Core.Test/PCL.Core.Test.csproj -c Beta -p:Platform=x64 --filter 'TestCategory!=Integration' --blame-hang-timeout 2m --logger 'trx;LogFileName=wzbc.trx' --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wzbc-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
